# 이 파일을 내 저장소의 .github/workflows/ci.yml 로 복사해요.
# 외부 Action 은 태그가 아니라 "커밋 해시"로 고정했어요 (11주 Trivy 사례).
# 해시 뒤의 주석이 사람이 읽는 버전이에요.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# 기본 권한은 최소로. 올리는 일(push)을 하는 작업에만 packages: write 를 줘요.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: 시험
        run: uv run pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # PR 에서는 로그인도 push 도 하지 않아요 (빌드가 되는지만 확인).
      - name: GHCR 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그 규칙: 커밋마다 sha-xxxxxxx, v1.2.3 태그를 달면 1.2.3 도 붙어요.
      # metadata-action 은 버전 태그에 latest 를 자동으로 붙이니 flavor 로 꺼요.
      - name: 태그와 라벨 만들기
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/iris-service
          flavor: |
            latest=false
          tags: |
            type=sha
            type=semver,pattern={{version}}

      - name: 빌드하고 올리기
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
